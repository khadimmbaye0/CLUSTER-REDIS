services:
  redis-master-1:
    container_name: redis-master-1
    image: redis:7.0.0
    command: ["sh", "/etc/initialize.sh"]
    volumes:
      - ./config/redis-master-1.conf:/etc/redis.conf
      - ./config/users.acl:/etc/redis/users.acl
      - ./script/redis-master-1.sh:/etc/initialize.sh
    restart: always
    depends_on:
      - redis-master-2
      - redis-master-3
      - redis-slave-1
      - redis-slave-2
      - redis-slave-3
      - redis-slave-4
      - redis-slave-5
      - redis-slave-6
    ports:
      - "7001:7001"
      - "17001:17001"

  redis-master-2:
    container_name: redis-master-2
    image: redis:7.0.0
    command: redis-server /etc/redis.conf
    volumes:
      - ./config/redis-master-2.conf:/etc/redis.conf
      - ./config/users.acl:/etc/redis/users.acl
    restart: always
    ports:
      - "7002:7002"
      - "17002:17002"

  redis-master-3:
    container_name: redis-master-3
    image: redis:7.0.0
    command: redis-server /etc/redis.conf
    volumes:
      - ./config/redis-master-3.conf:/etc/redis.conf
      - ./config/users.acl:/etc/redis/users.acl
    restart: always
    ports:
      - "7003:7003"
      - "17003:17003"

  redis-slave-1:
    container_name: redis-slave-1
    image: redis:7.0.0
    command: redis-server /etc/redis.conf
    volumes:
      - ./config/redis-slave-1.conf:/etc/redis.conf
      - ./config/users.acl:/etc/redis/users.acl
    restart: always
    ports:
      - "7004:7004"
      - "17004:17004"

  redis-slave-2:
    container_name: redis-slave-2
    image: redis:7.0.0
    command: redis-server /etc/redis.conf
    volumes:
      - ./config/redis-slave-2.conf:/etc/redis.conf
      - ./config/users.acl:/etc/redis/users.acl
    restart: always
    ports:
      - "7005:7005"
      - "17005:17005"

  redis-slave-3:
    container_name: redis-slave-3
    image: redis:7.0.0
    command: redis-server /etc/redis.conf
    volumes:
      - ./config/redis-slave-3.conf:/etc/redis.conf
      - ./config/users.acl:/etc/redis/users.acl
    restart: always
    ports:
      - "7006:7006"
      - "17006:17006"

  redis-slave-4:
    container_name: redis-slave-4
    image: redis:7.0.0
    command: redis-server /etc/redis.conf
    volumes:
      - ./config/redis-slave-4.conf:/etc/redis.conf
      - ./config/users.acl:/etc/redis/users.acl
    restart: always
    ports:
      - "7007:7007"
      - "17007:17007"

  redis-slave-5:
    container_name: redis-slave-5
    image: redis:7.0.0
    command: redis-server /etc/redis.conf
    volumes:
      - ./config/redis-slave-5.conf:/etc/redis.conf
      - ./config/users.acl:/etc/redis/users.acl
    restart: always
    ports:
      - "7008:7008"
      - "17008:17008"

  redis-slave-6:
    container_name: redis-slave-6
    image: redis:7.0.0
    command: redis-server /etc/redis.conf
    volumes:
      - ./config/redis-slave-6.conf:/etc/redis.conf
      - ./config/users.acl:/etc/redis/users.acl
    restart: always
    ports:
      - "7009:7009"
      - "17009:17009"

  redis-stat:
    container_name: redis-stat
    image: insready/redis-stat
    ports:
      - "8080:63790"
    command: -a Default@Stat2026 --server host.docker.internal:7001 host.docker.internal:7002 host.docker.internal:7003 host.docker.internal:7004 host.docker.internal:7005 host.docker.internal:7006 host.docker.internal:7007 host.docker.internal:7008 host.docker.internal:7009
    restart: always
    depends_on:
      - redis-master-1

  redis-insight:
    container_name: redis-insight
    image: redis/redisinsight:latest
    ports:
      - "5540:5540"
    restart: always
    depends_on:
      - redis-master-1
      - redis-master-2
      - redis-master-3
      - redis-slave-1
      - redis-slave-2
      - redis-slave-3
      - redis-slave-4
      - redis-slave-5
      - redis-slave-6